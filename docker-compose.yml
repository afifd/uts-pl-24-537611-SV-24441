services:
  utskepl_postgres:
    image: postgres:18
    container_name: utskepl_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - utskepl:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - utskepl_net

  utskepl_backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: utskepl_backend
    restart: unless-stopped
    depends_on:
      utskepl_postgres:
        condition: service_healthy
    environment:
      APP_NAME: "UTS KEPL"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      APP_URL: http://localhost:8000
      LOG_CHANNEL: stdout
      LOG_LEVEL: debug
      DB_CONNECTION: pgsql
      DB_HOST: utskepl_postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_NAME}
      DB_USERNAME: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - utskepl_net

  utskepl_frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: utskepl_frontend
    restart: unless-stopped
    depends_on:
      utskepl_backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - utskepl_net

volumes:
  utskepl:

networks:
  utskepl_net:
    driver: bridge
