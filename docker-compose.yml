services:
  utskepl_postgres:
    image: postgres:18
    container_name: utskepl_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - utskepl:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - utskepl_net

  utskepl_backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: utskepl_backend
    restart: unless-stopped
    depends_on:
      utskepl_postgres:
        condition: service_healthy
    environment:
      APP_NAME: "UTS KEPL"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      APP_URL: http://localhost:8000
      LOG_CHANNEL: stdout
      LOG_LEVEL: debug
      DB_CONNECTION: pgsql
      DB_HOST: utskepl_postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_NAME}
      DB_USERNAME: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - utskepl_net

  utskepl_frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: utskepl_frontend
    restart: unless-stopped
    depends_on:
      utskepl_backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - utskepl_net

  utskepl_prometheus:
    image: docker.io/prom/prometheus:v3.13.5
    container_name: utskepl_prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:Z,ro
      - ./monitoring/prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml:Z,ro
      - utskepl_prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-lifecycle"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - utskepl_net

  utskepl_grafana:
    image: docker.io/grafana/grafana:13.3.0
    container_name: utskepl_grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - utskepl_grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:Z,ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:Z,ro
    depends_on:
      - utskepl_prometheus
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - utskepl_net

  utskepl_cadvisor:
    image: ghcr.io/google/cadvisor:0.60.5
    container_name: utskepl_cadvisor
    restart: unless-stopped
    privileged: true
    cgroup: host
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - /:/rootfs:ro
      - /sys:/sys:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
      - /run/user/1000/podman/podman.sock:/var/run/docker.sock:ro
      - /dev/disk/:/dev/disk:ro
    command:
      - "--docker=unix:///var/run/docker.sock"
    devices:
      - /dev/kmsg
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - utskepl_net

  utskepl_node_exporter:
    image: quay.io/prometheus/node-exporter:v1.12.1
    container_name: utskepl_node_exporter
    restart: unless-stopped
    pid: host
    ports:
      - "127.0.0.1:9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - utskepl_net

volumes:
  utskepl:
  utskepl_prometheus_data:
  utskepl_grafana_data:

networks:
  utskepl_net:
    driver: bridge
